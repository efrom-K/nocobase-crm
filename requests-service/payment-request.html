<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка на оплату · CRM</title>
<style>
  :root { color-scheme: light; --ink: #1c2d58; --muted: #526078; --line: #cbd4e2; --surface: #f4f7fb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { width: min(100% - 40px, 700px); margin: clamp(24px, 6vh, 64px) auto; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; }
  .back:hover { color: var(--ink); text-decoration: underline; }
  .card { overflow: hidden; background: #fff; border: 1px solid #dce4ef; border-radius: 16px; box-shadow: 0 12px 32px #1c2d5810; }
  header { padding: 24px 32px; background: linear-gradient(110deg, #1c2d58, #2e477c); color: #fff; }
  h1 { margin: 0; font-size: clamp(23px, 4vw, 31px); font-weight: 700; letter-spacing: -.025em; }
  form { display: grid; gap: 18px; padding: 24px 32px; }
  form[hidden] { display: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: grid; min-width: 0; gap: 6px; font-size: 14px; font-weight: 650; }
  small { color: var(--muted); font-weight: 400; }
  input, select, textarea, button { width: 100%; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; color: inherit; font: 400 16px/1.35 system-ui, sans-serif; }
  textarea { resize: vertical; }
  :is(input, select, textarea, a, button):focus-visible { outline: 2px solid #3865b0; outline-offset: 2px; }
  .attachment { padding: 13px 14px; border: 1px dashed #9baecb; border-radius: 10px; background: var(--surface); }
  input[type=file] { border: 0; padding: 0; background: transparent; }
  input::file-selector-button { margin-right: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .actions { display: flex; justify-content: flex-end; padding-top: 3px; }
  button { width: auto; padding-inline: 20px; border-color: var(--ink); background: var(--ink); color: #fff; font-weight: 650; cursor: pointer; }
  button:hover:enabled { background: #2e477c; }
  button:disabled { opacity: .6; cursor: wait; }
  #status { margin: 0 32px 24px; padding: 10px 12px; border-radius: 8px; background: var(--surface); color: var(--ink); }
  form[hidden] + #status { margin-top: 24px; }
  #status:empty { display: none; }
  @media (max-width: 480px) {
    main { width: calc(100% - 24px); margin-block: 16px; }
    header, form { padding: 18px; }
    .pair { grid-template-columns: 1fr; }
    .actions button { width: 100%; }
    #status { margin-inline: 18px; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="/admin/">← В CRM</a>
  <section class="card" aria-labelledby="payment-title">
    <header><h1 id="payment-title">Заявка на оплату</h1></header>
    <form hidden id="request">
      <label>Объект<select name="object" required><option value="">Выберите объект</option></select></label>
      <label>Цель расхода<textarea name="purpose" rows="3" maxlength="1000" required></textarea></label>
      <div class="pair">
        <label>Сумма, ₽<input name="amount" inputmode="decimal" pattern="[0-9]{1,10}([.,][0-9]{1,2})?" required></label>
        <label>Оплатить до<input type="date" name="due" required></label>
      </div>
      <label>Комментарий<textarea name="comment" rows="2" maxlength="2000"></textarea></label>
      <label class="attachment">Счёт<input name="bill" type="file" accept=".pdf,.jpg,.jpeg,.png" aria-describedby="bill-format" required><small id="bill-format">PDF, JPEG или PNG до 5 МБ</small></label>
      <div class="actions"><button type="submit">Отправить на согласование</button></div>
    </form>
    <p id="status" role="status">Загрузка формы…</p>
  </section>
</main>
<script>
  const form = document.getElementById('request');
  const status = document.getElementById('status');
  const button = form.querySelector('button');
  async function api(input) {
    const token = localStorage.getItem('NOCOBASE_TOKEN');
    const response = await fetch('/rqsvc/payment-request/api', {
      method: input ? 'POST' : 'GET',
      headers: { Authorization: 'Bearer ' + (token || ''), 'Content-Type': 'application/json' },
      body: input && JSON.stringify(input)
    });
    if (response.status === 401) throw new Error('Войдите в CRM, затем снова откройте форму');
    if (response.status === 413) throw new Error('Файл слишком большой');
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Не удалось связаться с Pyrus');
    return result;
  }
  api().then(result => {
    for (const object of result.objects) form.elements.object.add(new Option(object.name, object.id));
    form.hidden = false;
    status.textContent = '';
  }).catch(error => { status.textContent = error.message; });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    const bill = form.elements.bill.files[0];
    if (!bill || bill.size > 5 * 1024 * 1024) {
      status.textContent = 'Приложите счёт размером до 5 МБ';
      return;
    }
    button.disabled = true;
    status.textContent = 'Отправляем заявку…';
    let sending = false;
    try {
      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(bill);
      });
      sending = true;
      const result = await api({
        object: Number(form.elements.object.value), purpose: form.elements.purpose.value,
        amount: form.elements.amount.value, due: form.elements.due.value,
        comment: form.elements.comment.value, file: { name: bill.name, data }
      });
      form.reset();
      form.hidden = true;
      status.textContent = 'Заявка № ' + result.id + ' отправлена на согласование.';
    } catch (error) {
      status.textContent = error instanceof TypeError && sending
        ? 'Связь прервалась. Уточните в АХО, появилась ли заявка, прежде чем отправлять её повторно'
        : error.message || 'Не удалось прочитать счёт';
      button.disabled = false;
    }
  });
</script>
</body>
</html>
