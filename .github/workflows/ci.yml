name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository checks (syntax, JSON, block map, personal data / secrets)
        run: python3 scripts/ci_checks.py
        env:
          # необязательно: регулярное выражение с приватными для вас словами (названия объектов, имена, домен) —
          # хранится в Settings → Secrets → Actions, в публичный репозиторий не попадает
          CI_DENYLIST_REGEX: ${{ secrets.CI_DENYLIST_REGEX }}
      - name: Price logic tests (card JS vs nightly Python vs expected values)
        run: python3 tests/price_logic_test.py
      - name: AHO routine dates
        run: node tests/aho_dates_test.js
      - name: Object directory and contract selection
        run: node tests/objects.test.js
      - name: Time input controls
        run: node tests/time_controls.test.js
      - name: Object map navigation
        run: node tests/object_map.test.js
      - name: Object directory migration (isolated PostgreSQL schema)
        run: python3 tests/object_directory_test.py
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
