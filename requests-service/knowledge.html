<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>База знаний CRM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17233b;font:16px/1.55 system-ui,sans-serif}
header{background:#162744;color:white;padding:18px max(24px,calc((100vw - 1180px)/2));display:flex;gap:24px;align-items:center}
header a{color:#d6e3fa}header h1{font-size:21px;margin:0}
main{max-width:1228px;margin:auto;padding:28px 24px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px}
aside,article{background:white;border:1px solid #dbe2ec;border-radius:10px;padding:22px;min-width:0;align-self:start}
h2,h3{line-height:1.2}h2{margin-top:0}input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;padding:9px;border:1px solid #afbbcc;border-radius:6px;color:inherit;background:white}
button{cursor:pointer;border:1px solid #a8b4c8;background:white;padding:7px 12px;border-radius:6px;color:inherit}
button.primary{background:#203f68;color:white;border-color:#203f68}button:disabled{opacity:.6;cursor:wait}
nav{margin-top:16px}nav button{display:block;text-align:left;width:100%;margin:4px 0;overflow-wrap:anywhere}
nav button[aria-current=true]{background:#e7eef8;border-color:#284971}.meta{color:#55647a;font-size:.9rem}
.tools,.fields{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.fields>*{flex:1 1 190px}
label{display:block;margin:8px 0}.content{overflow-wrap:anywhere}.content pre{white-space:pre-wrap;background:#edf1f6;padding:12px}
a{color:#1e5190}#status{grid-column:1/-1;margin:0;color:#973838}#status:empty{display:none}
[hidden]{display:none!important}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px;gap:12px}aside,article{padding:16px}}
</style>
</head>
<body>
<header><a href="/admin">CRM</a><h1>База знаний</h1></header>
<main>
<p id="status" role="status"></p>
<aside>
  <label>Поиск по статьям<input id="search" type="search" maxlength="200"></label>
  <button id="new" class="primary" hidden>Создать статью</button>
  <nav id="topics" aria-label="Темы и статьи"></nav>
</aside>
<article id="article"><h2>База знаний CRM</h2><p>Выберите статью или найдите её через поиск.</p></article>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const status = el('status'), panel = el('article'), nav = el('topics'), search = el('search');
const labels = {all:'Все сотрудники',managers:'Управляющие',accounting_dept:'Бухгалтерия',legal_dept:'Юристы',
  rental_dept:'Аренда',hr:'Кадры',aho:'АХО',draft:'Черновик',published:'Опубликована',archived:'Архив'};
let model, searchTimer, browseSequence = 0, articleSequence = 0;
function node(tag,text,parent) {
  const element = document.createElement(tag);
  if (text != null) element.textContent = text;
  parent?.append(element);
  return element;
}
function btn(parent,label,action) {
  const element = node('button',label,parent);
  element.type = 'button';
  element.onclick = action;
  return element;
}
async function api(query='', values) {
  const res = await fetch('/rqsvc/knowledge/api' + query, {
    method: values ? 'POST' : 'GET',
    headers: {Authorization:'Bearer '+(localStorage.getItem('NOCOBASE_TOKEN') || ''),'Content-Type':'application/json'},
    body: values && JSON.stringify(values)
  });
  if (res.status === 401) throw Error('Войдите в CRM, затем снова откройте базу знаний');
  const result = await res.json();
  if (!res.ok) throw Error(result.error || 'Запрос не выполнен');
  return result;
}
function report(error) { status.textContent = error.message; }
function currentId() { return Number(new URL(location.href).searchParams.get('id')); }
async function browse() {
  const sequence = ++browseSequence;
  const next = await api('?q='+encodeURIComponent(search.value));
  if (sequence !== browseSequence) return;
  model = next;
  el('new').hidden = !model.canEdit;
  nav.replaceChildren();
  for (const topic of new Set([...model.topics,...model.articles.map(a=>a.topic)])) {
    const articles = model.articles.filter(a=>a.topic===topic);
    if (search.value.trim() && !articles.length) continue;
    node('h3',topic,nav);
    if (!articles.length) node('p','Статей пока нет',nav).className='meta';
    for (const a of articles) {
      const link = btn(nav,a.title + (a.state==='published' ? '' : ' · '+labels[a.state]),()=>open(a.id,true).catch(report));
      link.dataset.id = String(a.id);
      if (a.id === currentId()) link.setAttribute('aria-current','true');
    }
  }
  if (!nav.children.length) node('p','Ничего не найдено',nav);
}
function inline(text,target) {
  let cursor = 0;
  for (const match of text.matchAll(/\[([^\]\n]+)\]\(([^\s)]+)\)|\*\*([^*]+)\*\*/g)) {
    target.append(text.slice(cursor,match.index));
    if (match[3]) node('strong',match[3],target);
    else if (/^(https:\/\/|\/(?![\/\\]))/i.test(match[2])) {
      const a = node('a',match[1],target);
      a.href = match[2];
      a.rel = 'noreferrer';
    } else target.append(match[0]);
    cursor = match.index + match[0].length;
  }
  target.append(text.slice(cursor));
}
function body(text,target) {
  let list = null;
  for (const line of text.split('\n')) {
    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    const item = /^[-*]\s+(.*)$/.exec(line);
    if (item) { list ||= node('ul',null,target); inline(item[1],node('li',null,list)); continue; }
    list = null;
    if (heading) inline(heading[2],node('h'+(heading[1].length+2),null,target));
    else if (line.trim()) inline(line,node('p',null,target));
  }
}
function show(article) {
  panel.replaceChildren();
  node('p',article.topic,panel).className='meta';
  node('h2',article.title,panel);
  node('p',[article.owner && 'Ответственный: '+article.owner,article.review && 'Пересмотр: '+article.review,
    model.canEdit && labels[article.state]].filter(Boolean).join(' · '),panel).className='meta';
  body(article.body,node('div',null,panel));
  if (model.canEdit) {
    const tools=node('div',null,panel); tools.className='tools';
    btn(tools,'Редактировать',()=>edit(article));
    btn(tools,'История версий',async()=>{
      try {
        const revisions=await api('?id='+article.id+'&history=1');
        if (currentId()!==article.id) return;
        panel.replaceChildren();
        node('h2','История · '+article.title,panel);
        btn(panel,'К статье',()=>show(article));
        for (const r of revisions) {
          const details=node('details',null,panel);
          node('summary','Версия '+r.version+' · '+new Date(r.updated).toLocaleString('ru')+' · '+r.editor,details);
          body(r.body,details);
          if (r.version!==article.version) btn(details,'Взять за основу',()=>edit({...r,version:article.version,state:'draft'}));
        }
      } catch (error) { report(error); }
    });
  }
}
async function open(id,navigate=false) {
  const sequence=++articleSequence;
  status.textContent='';
  if (navigate) history.pushState(null,'','?id='+id);
  const result=await api('?id='+id);
  if (sequence!==articleSequence) return;
  show(result);
  nav.querySelectorAll('[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
  nav.querySelector('[data-id="'+id+'"]')?.setAttribute('aria-current','true');
}
function edit(article={}) {
  ++articleSequence;
  status.textContent='';
  panel.replaceChildren();
  node('h2',article.id ? 'Редактирование статьи' : 'Новая статья',panel);
  const form=node('form',null,panel), controls={};
  function field(parent,key,label,type,options) {
    const group=node('label',label,parent);
    const input=node(options ? 'select' : type==='textarea' ? 'textarea' : 'input',null,group);
    if (options) for (const value of options) input.add(new Option(labels[value] || value,value));
    else if (type==='textarea') { input.rows=16; input.maxLength=70000; }
    else { input.type=type; if (key==='title') input.maxLength=180; if (key==='owner') input.maxLength=120; }
    input.value=article[key] ?? options?.[0] ?? '';
    controls[key]=input;
    return input;
  }
  field(form,'title','Заголовок','text').required=true;
  const fields=node('div',null,form); fields.className='fields';
  const topic=field(fields,'topic','Тема','text');
  topic.value=article.topic || model.topics[0];
  topic.required=true;
  topic.maxLength=100;
  const suggestions=node('datalist',null,form);
  suggestions.id='topic-suggestions';
  for (const name of new Set([...model.topics,...model.articles.map(a=>a.topic)])) suggestions.append(new Option(name,name));
  topic.setAttribute('list',suggestions.id);
  field(fields,'audience','Кому доступна',null,model.audiences);
  field(fields,'state','Статус',null,['draft','published','archived']);
  field(fields,'owner','Ответственный','text');
  field(fields,'review','Дата пересмотра','date');
  field(form,'body','Текст · поддерживаются Markdown-заголовки, списки и ссылки','textarea').required=true;
  const tools=node('div',null,form); tools.className='tools';
  const save=node('button','Сохранить',tools); save.className='primary';
  btn(tools,'Отмена',()=>article.id ? show(article) : panel.replaceChildren(node('h2','База знаний CRM')));
  form.onsubmit=async event=>{
    event.preventDefault(); save.disabled=true; status.textContent='';
    try {
      const values=Object.fromEntries(Object.entries(controls).map(([key,input])=>[key,input.value]));
      if (article.id) Object.assign(values,{id:article.id,version:article.version});
      const saved=await api('',values);
      await open(saved.id,true);
      await browse();
    } catch (error) { report(error); }
    finally { save.disabled=false; }
  };
}
el('new').onclick=()=>edit();
search.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>browse().catch(report),220);};
window.onpopstate=()=>{++articleSequence; panel.replaceChildren(node('h2','База знаний CRM')); if(currentId())open(currentId()).catch(report);};
browse().then(()=>currentId() && open(currentId())).catch(report);
</script>
</body>
</html>
