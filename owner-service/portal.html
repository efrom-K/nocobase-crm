<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1c2d58">
<title>Кабинет собственника — Консалт Недвижимость</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="icon" type="image/svg+xml" href="/brand/kn-mark.svg">
<style>
  /* брендбук v1.2: синий — единственный акцент, Fira, карточки 22 / поля 14 / кнопки-капсулы. Каркас — как у портала арендатора (requests-service/portal.html) */
  :root {
    --navy:var(--kn-navy, #1c2d58); --navy-d:var(--kn-navy-2, #2f4a8a); --navy-soft:var(--kn-ice-soft, #eef2f9); --ice:var(--kn-ice, #dde5f3);
    --ink:var(--kn-ink, #1f2433); --text:var(--kn-ink-2, #3a4256); --muted:var(--kn-muted, #5b6478); --line:var(--kn-line, #dfe3ec); --line-d:var(--kn-line-2, #c3cad8);
    --bg:var(--kn-paper, #f3f5f9); --bg-2:var(--kn-paper-2, #e9edf5); --surface:#fff;
    --ok:var(--kn-ok, #2f7d4f); --ok-soft:var(--kn-ok-soft, #e5f1ea); --warn:var(--kn-warn, #8a5a00); --warn-soft:var(--kn-warn-soft, #f6eedb); --bad:var(--kn-err, #c23b3b); --bad-soft:var(--kn-err-soft, #f9e6e6);
    --cond:var(--kn-cond, "Fira Sans Condensed", sans-serif); --sans:var(--kn-sans, "Fira Sans", system-ui, sans-serif); --mono:var(--kn-mono, "Fira Mono", ui-monospace, monospace);
    --r:var(--kn-r, 22px); --r-sm:var(--kn-r-sm, 14px); --shadow:var(--kn-shadow, 0 12px 32px -12px rgba(18,29,58,.18)); --focus:var(--kn-focus, 0 0 0 3px rgba(47,74,138,.28));
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  h1, h2, h3 { color:var(--ink); margin:0; }
  h1 { font:600 32px/1.1 var(--cond); letter-spacing:-.005em; }
  h2 { font:600 21px/1.15 var(--cond); }
  h3 { display:flex; align-items:center; gap:10px; font:400 12px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  h3::before { content:""; width:18px; height:1px; background:currentColor; }
  a { color:var(--navy); }
  button, input, select, textarea { font:inherit; color:inherit; }
  svg.i { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .wrap { width:100%; max-width:1180px; margin:0 auto; padding:0 40px; }
  .num { font-family:var(--mono); }

  /* шапка и подвал */
  .hdr { background:var(--navy); color:#fff; }
  .hdr .wrap { display:flex; align-items:center; gap:18px; height:72px; }
  .hdr img { height:40px; width:auto; display:block; }
  .hdr .sep { width:1px; height:28px; background:rgba(255,255,255,.22); }
  .hdr .tag { font:400 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.75); white-space:nowrap; }
  .hdr .who { margin-left:auto; font-size:14px; color:rgba(255,255,255,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .hdr .btn { color:#fff; border-color:rgba(255,255,255,.35); background:transparent; }
  .hdr .btn:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.65); }
  main { flex:1; padding:32px 0 56px; }
  footer { background:var(--kn-deep, #121d3a); color:rgba(255,255,255,.62); font-size:14px; }
  footer .wrap { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:22px; padding-bottom:24px; }
  footer a { color:rgba(255,255,255,.85); text-decoration:none; } footer a:hover { color:#fff; }
  .demo-bar { background:var(--warn-soft); color:var(--warn); font-size:14px; text-align:center; padding:8px 16px; }

  /* кнопки — капсулы */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px; border-radius:999px; border:1px solid var(--line-d); background:var(--surface); color:var(--ink); font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; transition:background .15s, border-color .15s; }
  .btn:hover { border-color:var(--navy); }
  .btn:focus-visible, .lnk:focus-visible, .tab:focus-visible, .row:focus-visible { outline:2px solid var(--navy-d); outline-offset:2px; }
  .btn.pri { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.pri:hover { background:var(--navy-d); border-color:var(--navy-d); }
  .btn.sm { height:36px; padding:0 16px; font-size:14px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .lnk { display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:0; color:var(--navy); font-weight:500; cursor:pointer; font-size:15px; }
  .lnk:hover { text-decoration:underline; }

  /* поверхности */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); }
  .pad { padding:28px; }
  .muted { color:var(--muted); } .small { font-size:14px; }
  .page-h { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .page-h p { margin:8px 0 0; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:20px; align-items:start; }
  .stack { display:flex; flex-direction:column; gap:20px; }

  /* вкладки */
  .tabs { display:flex; gap:28px; border-bottom:1px solid var(--line-d); margin-bottom:28px; overflow-x:auto; }
  .tab { background:none; border:0; padding:10px 0 12px; margin-bottom:-1px; border-bottom:2px solid transparent; color:var(--muted); font-weight:500; cursor:pointer; display:inline-flex; gap:8px; align-items:center; white-space:nowrap; }
  .tab:hover { color:var(--ink); }
  .tab.on { color:var(--navy); border-bottom-color:var(--navy); }

  /* KPI */
  .kpi { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:20px; }
  .kpi > div { padding:22px 24px; display:flex; flex-direction:column; gap:4px; }
  .kpi span { color:var(--muted); font-size:14px; }
  .kpi b { font:600 34px/1.1 var(--cond); color:var(--ink); white-space:nowrap; }
  .kpi small { font:400 13px var(--mono); color:var(--navy); }
  .kpi .hero { background:var(--navy); border-color:var(--navy); }
  .kpi .hero span, .kpi .hero small { color:rgba(255,255,255,.78); } .kpi .hero b { color:#fff; }
  .up::before { content:"↑ "; }

  /* график */
  .chart-h { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .seg { display:inline-flex; background:var(--bg-2); border-radius:999px; padding:3px; }
  .seg button { border:0; background:none; border-radius:999px; padding:5px 14px; font-size:14px; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(18,29,58,.12); }
  .chart { position:relative; }
  .chart svg { width:100%; height:auto; display:block; overflow:visible; }
  .chart .b { fill:var(--ice); transition:fill .15s; } .chart .b.cur { fill:var(--navy); }
  .chart .col:hover .b { fill:var(--navy-d); }
  .chart .ax { stroke:var(--line-d); }
  .chart .m { font:400 11px var(--mono); fill:var(--muted); }
  .chart .v { font:500 12px var(--mono); fill:var(--ink); }
  .tip { position:absolute; pointer-events:none; background:var(--ink); color:#fff; border-radius:10px; padding:8px 12px; font-size:13px; white-space:nowrap; transform:translate(-50%, -100%); margin-top:-10px; box-shadow:var(--shadow); }
  .tip b { display:block; font:600 16px var(--cond); }

  /* ленты */
  .feed { list-style:none; margin:0; padding:0; }
  .feed li { display:grid; grid-template-columns:1fr auto; gap:2px 16px; padding:14px 0; border-top:1px solid var(--line); }
  .feed li:first-child { border-top:0; padding-top:0; }
  .feed b { color:var(--ink); font-weight:500; } .feed span { color:var(--muted); font-size:14px; }
  .feed em { grid-row:1 / span 2; grid-column:2; align-self:center; font:500 14px var(--mono); font-style:normal; color:var(--navy); white-space:nowrap; }
  .feed--stack li { grid-template-columns:1fr; } .feed--stack em { grid-row:auto; grid-column:1; margin-top:4px; }
  .st { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; font-size:13px; font-weight:500; white-space:nowrap; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st-wait { color:var(--warn); background:var(--warn-soft); }
  .st-talk { color:var(--navy); background:var(--ice); }

  /* объекты */
  .obj { padding:28px; }
  .obj + .obj { margin-top:20px; }
  .obj-h { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-bottom:20px; }
  .obj-h p { margin:6px 0 0; color:var(--muted); font-size:15px; }
  .facts { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:24px; }
  .facts div { background:var(--bg); border-radius:var(--r-sm); padding:14px 16px; }
  .facts span { display:block; font-size:13px; color:var(--muted); } .facts b { font:600 24px/1.2 var(--cond); color:var(--ink); } .facts small { display:block; font:400 12.5px var(--mono); color:var(--navy); }
  .tenants { width:100%; border-collapse:collapse; font-size:15px; }
  .tenants th { text-align:left; font:400 12px var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:0 12px 10px 0; border-bottom:1px solid var(--line-d); }
  .tenants td { padding:11px 12px 11px 0; border-bottom:1px solid var(--line); }
  .tenants .n { text-align:right; font-family:var(--mono); font-size:14px; white-space:nowrap; }
  .bar { display:inline-block; height:6px; border-radius:3px; background:var(--navy); vertical-align:middle; margin-right:10px; }
  .vac { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .vac div { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 16px; border:1px dashed var(--line-d); border-radius:var(--r-sm); font-size:15px; }
  .vac small { display:block; color:var(--muted); font-size:13.5px; }

  /* отчёты */
  .row { width:100%; display:grid; grid-template-columns:44px minmax(0,1fr) 150px 170px 110px; gap:16px; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .ico { width:44px; height:44px; border-radius:12px; background:var(--ice); color:var(--navy); display:grid; place-items:center; }
  .row .t { font-weight:500; color:var(--ink); } .row .d { font:400 14px var(--mono); color:var(--text); }
  .row.soon { color:var(--muted); background:var(--bg); } .row.soon .t { color:var(--muted); } .row.soon .ico { background:var(--bg-2); color:var(--muted); }
  .chip { display:inline-block; font:400 12px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }

  /* формы */
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field > span { font-size:14px; color:var(--muted); }
  .field input, .field textarea { width:100%; border:1px solid var(--line-d); border-radius:var(--r-sm); padding:10px 14px; background:var(--surface); resize:vertical; }
  .field input:focus, .field textarea:focus { outline:0; border-color:var(--navy); box-shadow:var(--focus); }
  .check { display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-top:1px solid var(--line); cursor:pointer; }
  .check:first-of-type { border-top:0; }
  .check input { width:18px; height:18px; margin-top:3px; accent-color:var(--navy); flex:none; }
  .check b { display:block; color:var(--ink); font-weight:500; } .check span { font-size:14px; color:var(--muted); }
  .msg { font-size:14px; min-height:20px; margin-top:10px; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }

  /* управляющий */
  .mgr { display:flex; gap:16px; align-items:center; }
  .mgr .ph { width:56px; height:56px; border-radius:var(--r-sm); background:var(--navy); color:#fff; display:grid; place-items:center; font:600 20px var(--cond); flex:none; }
  .mgr b { display:block; color:var(--ink); } .mgr span { font-size:14px; color:var(--muted); }
  .mgr-acts { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  /* вход */
  .login { max-width:440px; margin:40px auto; }
  .login h1 { margin-bottom:8px; } .login p { margin:0 0 22px; color:var(--muted); }
  .hint { background:var(--navy-soft); border-radius:var(--r-sm); padding:12px 14px; font-size:14px; margin-bottom:16px; }

  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:999px; font-size:15px; box-shadow:var(--shadow); z-index:10; }

  @media (max-width: 980px) {
    .kpi { grid-template-columns:1fr 1fr; } .grid2 { grid-template-columns:1fr; } .facts { grid-template-columns:1fr 1fr; }
    .row { grid-template-columns:44px minmax(0,1fr) 100px; } .row .hide-m { display:none; }
  }
  @media (max-width: 600px) {
    .wrap { padding:0 16px; } .hdr .tag, .hdr .sep, .hdr .who { display:none; } .hdr .btn { margin-left:auto; }
    .kpi b { font-size:28px; } .kpi > div { padding:18px; } h1 { font-size:27px; } .pad, .obj { padding:20px; }
  }
</style>
</head>
<body>
<div class="demo-bar">Демо-версия кабинета собственника: цифры условные, в рабочей версии — из CRM</div>
<header class="hdr">
  <div class="wrap">
    <img src="/brand/kn-logo-white.svg" alt="Консалт Недвижимость">
    <span class="sep"></span><span class="tag">Кабинет собственника</span>
    <span class="who" id="who"></span>
    <button class="btn sm" id="logout" hidden>Выйти</button>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><span>© ООО «Консалт Недвижимость»</span><span><a href="tel:+74957977742">+7 495 797-77-42</a> · <a href="https://ykinvest.ru" target="_blank" rel="noopener">ykinvest.ru</a></span></div></footer>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ');
const mln = (n) => (n / 1e6).toFixed(1).replace('.', ',') + ' млн ₽';
const pct = (x) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(0) + '%';
const pp = (x) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1).replace('.', ',') + ' п. п.';
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const date = (iso) => { const [y, m, d] = iso.slice(0, 10).split('-'); return `${+d} ${MG[+m - 1]}${y === '2026' ? '' : ' ' + y}`; };
const monthName = (ym) => { const s = MN[+ym.slice(5) - 1]; return s[0].toUpperCase() + s.slice(1) + ' ' + ym.slice(0, 4); };
const I = {
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
};
const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const TABS = ['home', 'objects', 'reports', 'settings'];
let token = null, data = null, tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
try { token = localStorage.getItem('kn-owner'); } catch (e) {}
// личная ссылка от управляющего: …/#t=<токен> — запоминаем и убираем из адреса
if (location.hash.startsWith('#t=')) { token = decodeURIComponent(location.hash.slice(3)); try { localStorage.setItem('kn-owner', token); } catch (e) {} history.replaceState(null, '', location.pathname); }

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error('Войдите заново'); }
  if (!r.ok) throw new Error(j.error || 'Ошибка сервера');
  return j;
}
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); }
function logout() { token = null; data = null; try { localStorage.removeItem('kn-owner'); } catch (e) {} render(); }
$('#logout').onclick = logout;

// ---------- вход ----------
function loginView() {
  $('#who').textContent = ''; $('#logout').hidden = true;
  $('#app').innerHTML = `<div class="login card pad">
    <h1>Вход в кабинет</h1><p>Пришлём код на почту, указанную в договоре управления.</p>
    <form id="f1"><label class="field"><span>Почта</span><input name="email" type="email" autocomplete="email" required value="demo@example.ru"></label>
    <button class="btn pri" style="width:100%">Получить код</button><p class="msg err" id="m1"></p></form>
    <form id="f2" hidden><div class="hint" id="hint"></div><label class="field"><span>Код из письма</span><input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></label>
    <button class="btn pri" style="width:100%">Войти</button><p class="msg err" id="m2"></p></form>
  </div>`;
  let email = '';
  $('#f1').onsubmit = async (e) => {
    e.preventDefault(); email = e.target.email.value;
    try { const r = await api('code', { email }); $('#f1').hidden = true; $('#f2').hidden = false; $('#hint').innerHTML = `Код отправлен на <b>${esc(email)}</b>.${r.demo_code ? ` В демо-версии код: <b class="num">${esc(r.demo_code)}</b>` : ''}`; $('#f2').code.focus(); }
    catch (err) { $('#m1').textContent = err.message; }
  };
  $('#f2').onsubmit = async (e) => {
    e.preventDefault();
    try { const r = await api('login', { email, code: e.target.code.value }); token = r.token; try { localStorage.setItem('kn-owner', token); } catch (er) {} render(); }
    catch (err) { $('#m2').textContent = err.message; }
  };
}

// ---------- график: одна серия, текущий месяц — синим, подсказка при наведении ----------
function barChart(months, key, fmt, label) {
  const w = 720, h = 230, top = 26, bottom = 30, n = months.length, gap = w / n, bw = Math.min(30, gap * .5);
  const max = Math.max(...months.map((m) => m[key])) * 1.08;
  const y = (v) => top + (h - top - bottom) * (1 - v / max);
  const cols = months.map((m, i) => {
    const x = gap * i + (gap - bw) / 2, yy = y(m[key]), last = i === n - 1;
    return `<g class="col" data-i="${i}"><rect x="${gap * i}" y="0" width="${gap}" height="${h}" fill="transparent"/>
      <path class="b${last ? ' cur' : ''}" d="M${x},${h - bottom} V${yy + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${h - bottom} Z"/>
      ${i === 0 || last ? `<text class="v" x="${x + bw / 2}" y="${yy - 8}" text-anchor="middle">${fmt(m[key], true)}</text>` : ''}
      <text class="m" x="${x + bw / 2}" y="${h - 9}" text-anchor="middle">${MN[+m.month.slice(5) - 1].slice(0, 3)}</text></g>`;
  }).join('');
  return `<div class="chart" data-chart><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}"><line class="ax" x1="0" x2="${w}" y1="${h - bottom}" y2="${h - bottom}"/>${cols}</svg><div class="tip" hidden></div></div>`;
}
function wireChart(root, months, key, fmt) {
  const box = $('[data-chart]', root), tip = $('.tip', box);
  box.addEventListener('mousemove', (e) => {
    const g = e.target.closest('.col'); if (!g) { tip.hidden = true; return; }
    const m = months[+g.dataset.i], r = box.getBoundingClientRect(), b = $('.b', g).getBoundingClientRect();
    tip.innerHTML = `${monthName(m.month)}<b>${fmt(m[key])}</b>`; tip.hidden = false;
    tip.style.left = (b.left + b.width / 2 - r.left) + 'px'; tip.style.top = (b.top - r.top) + 'px';
  });
  box.addEventListener('mouseleave', () => { tip.hidden = true; });
}
const METRICS = {
  collected: { label: 'Поступления', fmt: (v, s) => s ? (v / 1e6).toFixed(1).replace('.', ',') : mln(v) },
  payout: { label: 'К перечислению вам', fmt: (v, s) => s ? (v / 1e6).toFixed(1).replace('.', ',') : mln(v) },
  occ: { label: 'Заполняемость', fmt: (v) => String(v).replace('.', ',') + '%' },
};

// ---------- экраны ----------
function shell(body) {
  const tabs = [['home', 'Обзор'], ['objects', 'Объекты'], ['reports', 'Отчёты'], ['settings', 'Настройки']];
  return `<nav class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab${tab === k ? ' on' : ''}" role="tab" aria-selected="${tab === k}" data-tab="${k}">${t}</button>`).join('')}</nav>${body}`;
}

function homeView() {
  const p = data.portfolio, k = p.kpi;
  const hour = new Date().getHours(), hi = hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
  return `
  <div class="page-h"><div><h1>${hi}, ${esc(data.owner.person)}</h1><p>${esc(data.owner.name)} · ${p.objects.length} объекта · ${num(k.area)} м² · данные на ${date(data.today)}</p></div></div>
  <div class="kpi">
    <div class="card hero"><span>Поступило за ${MN[+p.month.slice(5) - 1]}</span><b>${mln(k.collected)}</b><small class="up">${pct(k.collectedYoY)} к прошлому году</small></div>
    <div class="card"><span>К перечислению вам</span><b>${mln(k.payout)}</b><small>${mln(k.payoutYtd)} с начала года</small></div>
    <div class="card"><span>Заполняемость</span><b>${String(k.occ).replace('.', ',')}%</b><small class="up">${pp(k.occYoY)} за год</small></div>
    <div class="card"><span>Средняя ставка</span><b>${num(k.rate)} ₽/м²</b><small class="up">${pct(k.rateYoY)} за год</small></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <div class="card pad">
        <div class="chart-h"><h3>За 12 месяцев</h3><div class="seg" role="group" aria-label="Показатель">${Object.entries(METRICS).map(([key, m], i) => `<button data-metric="${key}" class="${i ? '' : 'on'}">${m.label}</button>`).join('')}</div></div>
        <div id="chart">${barChart(p.months, 'collected', METRICS.collected.fmt, 'Поступления за 12 месяцев')}</div>
        <p class="small muted" style="margin:12px 0 0">Собираемость платежей — ${(k.collection * 100).toFixed(1).replace('.', ',')}%. С начала года поступило ${mln(k.collectedYtd)}.</p>
      </div>
      <div class="card pad"><h3 style="margin-bottom:18px">Новости</h3>
        <ul class="feed">${data.news.map((x) => `<li><b>${esc(x.title)}</b><span>${date(x.date)} · ${esc(x.text)}</span><em>${esc(x.effect)}</em></li>`).join('')}</ul>
      </div>
    </div>
    <div class="stack">
      <div class="card pad">
        <h3 style="margin-bottom:18px">Последний отчёт</h3>
        ${data.reports[0] ? `<p style="margin:0 0 4px;color:var(--ink);font-weight:500">${esc(data.reports[0].title)}</p><p class="small muted" style="margin:0 0 16px">Отправлен ${date(data.reports[0].sent)}</p>
        <button class="btn" data-pdf="${data.reports[0].id}">${icon('doc')}Открыть PDF</button>` : ''}
        ${data.upcoming[0] ? `<p class="small muted" style="margin:16px 0 0">${esc(data.upcoming.find((r) => r.kind === 'month')?.title || data.upcoming[0].title)} придёт ${date((data.upcoming.find((r) => r.kind === 'month') || data.upcoming[0]).sent)}</p>` : ''}
      </div>
      ${managerCard()}
    </div>
  </div>`;
}

function managerCard() {
  const m = data.manager;
  return `<div class="card pad"><h3 style="margin-bottom:18px">Ваш управляющий</h3>
    <div class="mgr"><span class="ph">${esc(m.name.split(' ').map((w) => w[0]).join('').slice(0, 2))}</span><div><b>${esc(m.name)}</b><span>${esc(m.role)}</span></div></div>
    <div class="mgr-acts"><a class="btn sm" href="${esc(m.phoneHref)}">${icon('phone')}Позвонить</a><a class="btn sm" href="${esc(m.telegram)}" target="_blank" rel="noopener">${icon('send')}Telegram</a></div>
    <form id="q" style="margin-top:16px"><label class="field" style="margin-bottom:10px"><span>Вопрос управляющему</span><textarea name="text" rows="2" maxlength="2000" placeholder="Например: когда планируется индексация?"></textarea></label><button class="btn sm pri">Отправить</button><p class="msg" id="qm"></p></form>
  </div>`;
}

function objectsView() {
  return data.portfolio.objects.map((o) => `<section class="card obj">
    <div class="obj-h"><div><h2>${esc(o.title)}</h2><p>${esc(o.type)} · ${esc(o.address)} · ${num(o.area)} м²</p></div></div>
    <div class="facts">
      <div><span>Поступило за месяц</span><b>${mln(o.collected)}</b><small class="up">${pct(o.collectedYoY)} за год</small></div>
      <div><span>Заполняемость</span><b>${o.occ}%</b><small class="up">${pp(o.occYoY)} за год</small></div>
      <div><span>Средняя ставка</span><b>${num(o.rate)} ₽/м²</b><small class="up">${pct(o.rateYoY)} за год</small></div>
      <div><span>К перечислению</span><b>${mln(o.payout)}</b><small>в этом месяце</small></div>
    </div>
    <div class="grid2">
      <div><h3 style="margin-bottom:14px">Поступления за 12 месяцев</h3><div data-objchart="${o.id}">${barChart(o.months, 'collected', METRICS.collected.fmt, 'Поступления по объекту')}</div></div>
      <div><h3 style="margin-bottom:14px">Арендаторы</h3>
        <table class="tenants"><thead><tr><th>Арендатор</th><th class="n">м²</th><th>Доля</th></tr></thead>
        <tbody>${o.tenants.map((t) => `<tr><td>${esc(t.name)}</td><td class="n">${num(t.area)}</td><td style="white-space:nowrap"><span class="bar" style="width:${Math.round(t.share * 90)}px"></span>${Math.round(t.share * 100)}%</td></tr>`).join('')}</tbody></table>
        ${o.vacant.length ? `<div class="vac">${o.vacant.map((v) => `<div><span><b style="font-weight:500;color:var(--ink)">${esc(v.title)} · ${num(v.area)} м²</b><small>${esc(v.note)}</small></span><span class="st ${v.status === 'Переговоры' ? 'st-wait' : 'st-talk'}">${esc(v.status)}</span></div>`).join('')}</div>` : `<p class="small" style="margin:16px 0 0;color:var(--ok)">${icon('check')} Свободных площадей нет</p>`}
      </div>
    </div>
  </section>`).join('');
}

const KIND = { month: 'Ежемесячный', quarter: 'Квартальный', week: 'Сводка за неделю' };
let repFilter = 'all';
function reportsView() {
  const show = (r) => repFilter === 'all' || (repFilter === 'week' ? r.kind === 'week' : r.kind !== 'week');
  const s = data.settings;
  return `
  <div class="page-h"><div><h1>Отчёты</h1><p>Ежемесячный отчёт — до 5 числа, квартальный — до 7 числа, короткая сводка — по понедельникам. Всё приходит на почту и хранится здесь.</p></div>
    <div class="seg" role="group" aria-label="Фильтр">${[['all', 'Все'], ['month', 'Отчёты'], ['week', 'Сводки']].map(([k, t]) => `<button data-rep="${k}" class="${repFilter === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
  <div class="card" style="overflow:hidden">
    ${data.upcoming.filter(show).map((r) => `<div class="row soon"><span class="ico">${icon('clock')}</span><div><div class="t">${esc(r.title)}</div><div class="chip">${KIND[r.kind]}</div></div><span class="d hide-m">придёт ${date(r.sent)}</span><span class="hide-m"></span><span></span></div>`).join('')}
    ${data.reports.filter(show).map((r) => `<div class="row"><span class="ico">${icon('doc')}</span><div><div class="t">${esc(r.title)}</div><div class="chip">${KIND[r.kind]}</div></div><span class="d hide-m">${date(r.sent)}</span><span class="d hide-m">${r.kind === 'week' ? '1 страница' : '3 страницы'} · PDF</span><button class="btn sm" data-pdf="${r.id}" ${r.ready ? '' : 'disabled'}>Открыть</button></div>`).join('')}
  </div>
  <p class="small muted" style="margin-top:14px">Получатели: ${s.emails.map(esc).join(', ')} · <button class="lnk small" data-tab="settings">изменить</button></p>`;
}

function settingsView() {
  const s = data.settings;
  return `<div class="grid2">
    <div class="card pad">
      <h3 style="margin-bottom:10px">Отчёты на почту</h3>
      <form id="settings">
        <label class="check"><input type="checkbox" name="monthly" ${s.monthly ? 'checked' : ''}><span><b>Ежемесячный отчёт</b><span>Доход, заполняемость, арендаторы, деньги к перечислению — до 5 числа</span></span></label>
        <label class="check"><input type="checkbox" name="quarterly" ${s.quarterly ? 'checked' : ''}><span><b>Квартальный отчёт</b><span>Итоги квартала и план на следующий — до 7 числа</span></span></label>
        <label class="check"><input type="checkbox" name="weekly" ${s.weekly ? 'checked' : ''}><span><b>Сводка за неделю</b><span>Одна страница по понедельникам: поступления и новости</span></span></label>
        <label class="field" style="margin-top:12px"><span>Кому отправлять — по одному адресу в строке</span><textarea name="emails" rows="3">${s.emails.map(esc).join('\n')}</textarea></label>
        <button class="btn pri">Сохранить</button><p class="msg" id="sm"></p>
      </form>
    </div>
    <div class="stack">
      <div class="card pad">
        <h3 style="margin-bottom:14px">Перечисления</h3>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:15px"><dt class="muted">Получатель</dt><dd style="margin:0">${esc(data.owner.name)}</dd><dt class="muted">Счёт</dt><dd style="margin:0" class="num">•••• 4417</dd><dt class="muted">Когда</dt><dd style="margin:0">до 10 числа следующего месяца</dd></dl>
        <p class="small muted" style="margin:14px 0 0">Реквизиты меняются только через управляющего — для вашей безопасности.</p>
      </div>
      <div class="card pad"><h3 style="margin-bottom:14px">Вход</h3><p class="small" style="margin:0">По коду на <b>${esc(data.email)}</b>. Сессия действует 30 дней на этом устройстве.</p></div>
    </div>
  </div>`;
}

// ---------- отрисовка и события ----------
async function render() {
  if (!token) return loginView();
  if (!data) {
    $('#app').innerHTML = '<p class="muted">Загружаем…</p>';
    try { data = await api('me'); } catch (e) { if (token) $('#app').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  }
  $('#who').textContent = data.owner.name; $('#logout').hidden = false;
  const views = { home: homeView, objects: objectsView, reports: reportsView, settings: settingsView };
  $('#app').innerHTML = shell(views[tab]());
  if (tab === 'home') wireChart($('#chart'), data.portfolio.months, 'collected', METRICS.collected.fmt);
  if (tab === 'objects') data.portfolio.objects.forEach((o) => wireChart($(`[data-objchart="${o.id}"]`), o.months, 'collected', METRICS.collected.fmt));
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { location.hash = t.dataset.tab; return; }
  const m = e.target.closest('[data-metric]');
  if (m) {
    const k = m.dataset.metric, M = METRICS[k];
    m.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === m));
    $('#chart').innerHTML = barChart(data.portfolio.months, k, M.fmt, M.label + ' за 12 месяцев');
    wireChart($('#chart'), data.portfolio.months, k, M.fmt); return;
  }
  const rf = e.target.closest('[data-rep]');
  if (rf) { repFilter = rf.dataset.rep; render(); return; }
  const pdf = e.target.closest('[data-pdf]');
  if (pdf) {
    const w = window.open('', '_blank');   // окно — сразу по клику, иначе браузер заблокирует его после загрузки
    try {
      const r = await fetch('/api/report/' + pdf.dataset.pdf + '.pdf', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Отчёт не загрузился');
      const url = URL.createObjectURL(await r.blob());
      if (w) w.location = url; else location.href = url;
    } catch (err) { if (w) w.close(); toast(err.message); }
    return;
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'q') {
    e.preventDefault();
    try { await api('question', { text: f.text.value }); f.reset(); $('#qm').className = 'msg ok'; $('#qm').textContent = 'Отправлено — управляющий ответит в течение рабочего дня'; }
    catch (err) { $('#qm').className = 'msg err'; $('#qm').textContent = err.message; }
  }
  if (f.id === 'settings') {
    e.preventDefault();
    try { const r = await api('settings', { settings: { monthly: f.monthly.checked, quarterly: f.quarterly.checked, weekly: f.weekly.checked, emails: f.emails.value.split(/[\s,;]+/) } }); data.settings = r.settings; $('#sm').className = 'msg ok'; $('#sm').textContent = 'Сохранено'; }
    catch (err) { $('#sm').className = 'msg err'; $('#sm').textContent = err.message; }
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) { tab = h; render(); window.scrollTo(0, 0); } });
render();
</script>
</body>
</html>
