<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f344a">
<title>Кабинет собственника — Консалт Недвижимость</title>
<link rel="stylesheet" href="/brand/brand.css">
<link rel="icon" type="image/svg+xml" href="/brand/kn-mark.svg">
<style>
  /* брендбук v1.3, как герой ykinvest-site: графитовый верх с главной цифрой, светлая рабочая часть.
     Tilda Sans, скругления 6 / теги 5, небесный акцент — только на тёмном, метки «[ … ]», кнопки-капсулы */
  :root {
    --navy:var(--kn-navy, #1c2d58); --navy-d:var(--kn-navy-2, #2f4a8a); --graphite:var(--kn-graphite, #2f344a); --sky:var(--kn-sky, #a6c2e8); --ice:var(--kn-ice, #dde5f3);
    --ink:var(--kn-ink, #1f2433); --text:var(--kn-ink-2, #3a4256); --muted:var(--kn-muted, #5b6478); --line:var(--kn-line, #dfe3ec); --line-d:var(--kn-line-2, #c3cad8);
    --bg:var(--kn-paper, #f3f5f9); --bg-2:var(--kn-paper-2, #e9edf5); --surface:#fff;
    --ok:var(--kn-ok, #2f7d4f); --ok-soft:var(--kn-ok-soft, #e5f1ea); --warn:var(--kn-warn, #8a5a00); --warn-soft:var(--kn-warn-soft, #f6eedb); --bad:var(--kn-err, #c23b3b); --bad-soft:var(--kn-err-soft, #f9e6e6);
    --font:var(--kn-tilda, "Tilda Sans", Arial, sans-serif);
    --r:var(--kn-r13, 6px); --r-tag:var(--kn-r13-tag, 5px);
    --shadow:0 1px 2px rgba(31,36,51,.04), 0 16px 40px -18px rgba(31,36,51,.22); --focus:0 0 0 3px rgba(47,74,138,.25);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.5 var(--font); font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  h1, h2, h3 { margin:0; font-weight:500; color:var(--ink); }
  .lbl { display:block; font-size:13px; letter-spacing:.03em; color:var(--muted); }
  .lbl::before { content:"[\00a0"; } .lbl::after { content:"\00a0]"; }
  a { color:var(--navy); }
  button, input, select, textarea { font:inherit; color:inherit; }
  svg.i { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .wrap { width:100%; max-width:1240px; margin:0 auto; padding:0 40px; }

  /* ---------- графитовый верх: шапка + вкладки + главное ---------- */
  .top { background:var(--graphite); color:#fff; position:relative; overflow:hidden; isolation:isolate; }
  .top::before { content:""; position:absolute; right:-220px; top:-260px; width:760px; aspect-ratio:1; border-radius:50%; z-index:-1; pointer-events:none;
    background:repeating-radial-gradient(circle, transparent 0 89px, rgba(166,194,232,.22) 89px 90px); }
  .bar { display:flex; align-items:center; gap:18px; height:76px; }
  .logo { display:flex; align-items:center; gap:12px; color:#fff; }
  .logo img { height:38px; display:block; }
  .logo b { display:block; font-size:16px; font-weight:500; text-transform:uppercase; letter-spacing:.01em; line-height:1.1; }
  .logo small { display:block; font-size:12px; color:rgba(255,255,255,.65); }
  .bar .tag { font-size:13px; color:var(--sky); white-space:nowrap; }
  .bar .tag::before { content:"[\00a0"; } .bar .tag::after { content:"\00a0]"; }
  .bar .demo { font-size:12px; color:rgba(255,255,255,.55); border:1px dashed rgba(255,255,255,.3); border-radius:var(--r-tag); padding:2px 8px; white-space:nowrap; }
  .bar .who { margin-left:auto; text-align:right; font-size:14px; color:rgba(255,255,255,.85); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .bar .who small { display:block; color:rgba(255,255,255,.55); font-size:12px; }
  .bar .btn { color:#fff; border-color:rgba(255,255,255,.3); background:transparent; }
  .bar .btn:hover { border-color:#fff; }
  .tabs { display:flex; gap:30px; border-bottom:1px solid rgba(255,255,255,.14); overflow-x:auto; scrollbar-width:none; }
  .tab { background:none; border:0; padding:12px 0 14px; margin-bottom:-1px; border-bottom:2px solid transparent; color:rgba(255,255,255,.62); font-weight:500; cursor:pointer; display:inline-flex; gap:8px; align-items:center; white-space:nowrap; }
  .tab:hover { color:#fff; }
  .tab.on { color:#fff; border-bottom-color:var(--sky); }
  .band { padding:40px 0 44px; }
  .band .lbl { color:rgba(255,255,255,.6); margin-bottom:12px; }
  .band h1 { color:#fff; font-size:40px; line-height:1.05; text-transform:uppercase; }
  .band p { margin:10px 0 0; color:rgba(255,255,255,.72); max-width:680px; }
  /* обзор: главная цифра слева, показатели справа */
  .band-home { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:48px; align-items:end; }
  .stamp { font-size:13px; color:rgba(255,255,255,.55); margin:0 0 22px !important; }
  .big { font-size:76px; font-weight:250; line-height:.95; color:#fff; letter-spacing:-.01em; white-space:nowrap; }
  .big small { font-size:.42em; font-weight:300; }
  .big-sub { margin-top:14px !important; font-size:15px; }
  .big-sub b { color:var(--sky); font-weight:500; }
  /* план/факт года */
  .plan { margin-top:26px; max-width:520px; }
  .plan-t { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:rgba(255,255,255,.6); margin-bottom:8px; }
  .plan-t b { color:#fff; font-weight:500; }
  .plan-bar { position:relative; height:6px; background:rgba(255,255,255,.14); border-radius:3px; }
  .plan-bar span { position:absolute; inset:0 auto 0 0; background:var(--sky); border-radius:3px; }
  .plan-bar i { position:absolute; top:-5px; bottom:-5px; width:2px; background:#fff; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); border-top:1px solid rgba(255,255,255,.18); }
  .kpis div { padding:16px 16px 0 0; }
  .kpis div + div { padding-left:16px; border-left:1px solid rgba(255,255,255,.12); }
  .kpis span { display:block; font-size:13px; color:rgba(255,255,255,.6); }
  .kpis b { display:block; font-size:30px; font-weight:300; color:#fff; line-height:1.2; white-space:nowrap; }
  .kpis small { font-size:13px; color:var(--sky); }
  .band-sum { display:flex; gap:48px; flex-wrap:wrap; margin-top:28px; }
  .band-sum div span { display:block; font-size:13px; color:rgba(255,255,255,.6); }
  .band-sum div b { font-size:32px; font-weight:300; color:#fff; }
  .band-sum .alert b { color:#ffb3b3; }

  /* ---------- светлая часть ---------- */
  main { flex:1; padding:32px 0 64px; }
  .cols { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; align-items:start; }
  .side { display:flex; flex-direction:column; gap:20px; position:sticky; top:20px; }
  .stack { display:flex; flex-direction:column; gap:24px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); }
  .pad { padding:28px; }
  .card-h { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .card-h h2 { font-size:17px; text-transform:uppercase; letter-spacing:.02em; }
  .card-h .sub { font-size:13.5px; color:var(--muted); }
  .muted { color:var(--muted); } .small { font-size:14px; }

  /* кнопки */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:44px; padding:0 22px; border-radius:999px; border:1px solid var(--line-d); background:var(--surface); color:var(--ink); font-size:15px; font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; transition:background .15s, border-color .15s, color .15s; }
  .btn:hover { border-color:var(--navy); }
  .btn:focus-visible, .lnk:focus-visible, .tab:focus-visible { outline:2px solid var(--sky); outline-offset:2px; }
  .btn.pri { background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.pri:hover { background:var(--navy-d); border-color:var(--navy-d); }
  .btn.sm { height:34px; padding:0 14px; font-size:14px; }
  .btn:disabled { opacity:.6; cursor:default; }
  .lnk { display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:0; color:var(--navy); font-weight:500; cursor:pointer; font-size:14px; text-decoration:none; }
  .lnk:hover { text-decoration:underline; }

  /* куда ушли деньги: одна шкала от начисленного */
  .split { display:flex; height:44px; overflow:hidden; border-radius:var(--r-tag); margin-bottom:18px; }
  .split span { height:100%; border-right:2px solid #fff; transition:filter .15s; }
  .split span:last-child { border-right:0; }
  .split span:hover { filter:brightness(1.12); }
  .s-you { background:var(--navy); } .s-ops { background:var(--navy-d); } .s-fee { background:var(--sky); } .s-gap { background:repeating-linear-gradient(135deg, var(--bg-2) 0 6px, var(--line-d) 6px 12px); }
  .legend { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .legend div { display:flex; flex-direction:column; gap:2px; font-size:14px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:8px; border-radius:2px; }
  .legend b { font-size:20px; font-weight:400; color:var(--ink); }
  .legend .you b { font-weight:500; color:var(--navy); }
  .note { margin:18px 0 0; padding-top:14px; border-top:1px solid var(--line); font-size:14px; color:var(--muted); }

  /* график */
  .seg { display:inline-flex; background:var(--bg-2); border-radius:var(--r); padding:3px; }
  .seg button { border:0; background:none; border-radius:var(--r-tag); padding:6px 12px; font-size:14px; color:var(--muted); cursor:pointer; }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(31,36,51,.12); }
  .chart { position:relative; }
  .chart svg { width:100%; height:auto; display:block; overflow:visible; }
  .chart .b { fill:var(--ice); transition:fill .15s; } .chart .b.cur { fill:var(--navy); }
  .chart .col:hover .b { fill:var(--navy-d); }
  .chart .grid { stroke:var(--line); stroke-dasharray:3 4; }
  .chart .ax { stroke:var(--line-d); }
  .chart .m { font-size:12px; fill:var(--muted); }
  .chart .y { font-size:11px; fill:var(--muted); }
  .chart .v { font-size:13px; font-weight:500; fill:var(--ink); }
  .tip { position:absolute; pointer-events:none; background:var(--graphite); color:#fff; border-radius:var(--r); padding:8px 12px; font-size:13px; white-space:nowrap; transform:translate(-50%, -100%); margin-top:-10px; box-shadow:var(--shadow); }
  .tip b { display:block; font-size:16px; font-weight:500; }

  /* изменения — дата, событие, эффект на доход */
  .feed { list-style:none; margin:0; padding:0; }
  .feed li { display:grid; grid-template-columns:64px 1fr auto; gap:2px 16px; padding:14px 0; border-top:1px solid var(--line); align-items:baseline; }
  .feed li:first-child { border-top:0; padding-top:0; }
  .feed time { font-size:13px; color:var(--muted); }
  .feed b { color:var(--ink); font-weight:500; } .feed span { grid-column:2; color:var(--muted); font-size:14px; }
  .feed em { grid-row:1 / span 2; grid-column:3; align-self:center; font-size:14px; font-weight:500; font-style:normal; color:var(--ok); white-space:nowrap; }

  /* требует внимания — компактный список, одно действие в строке */
  .att { list-style:none; margin:0; padding:0; }
  .att li { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; padding:14px 0 14px 14px; border-top:1px solid var(--line); position:relative; }
  .att li:first-child { border-top:0; }
  .att li::before { content:""; position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:2px; background:var(--line-d); }
  .att li.warn::before { background:#d79a1e; } .att li.bad::before { background:var(--bad); } .att li.info::before { background:var(--navy); }
  .att b { color:var(--ink); font-weight:500; font-size:15px; line-height:1.3; }
  .att span { grid-column:1; font-size:13.5px; color:var(--muted); line-height:1.35; }
  .att .st { grid-row:1 / span 2; grid-column:2; font-style:normal; }
  .att li[data-tab] { cursor:pointer; } .att li[data-tab]:hover b { color:var(--navy); text-decoration:underline; }
  .ok-line { display:flex; gap:8px; align-items:center; color:var(--ok); font-size:15px; margin:0; }

  /* управляющий и отчёт */
  .mgr { display:flex; gap:14px; align-items:center; }
  .mgr .ph { width:52px; height:52px; border-radius:var(--r); background:var(--graphite); color:var(--sky); display:grid; place-items:center; font-size:19px; font-weight:500; flex:none; }
  .mgr b { display:block; color:var(--ink); font-weight:500; } .mgr span { font-size:13.5px; color:var(--muted); }
  .mgr-acts { display:flex; gap:8px; margin-top:16px; }
  .mgr-acts .btn { flex:1; padding:0 10px; }
  .mgr-tel { display:block; margin-top:14px; font-size:22px; font-weight:300; color:var(--ink); text-decoration:none; }
  .q { margin-top:14px; }
  .q textarea { width:100%; border:1px solid var(--line-d); border-radius:var(--r); padding:10px 12px; resize:vertical; min-height:84px; background:var(--surface); }
  .q textarea:focus { outline:0; border-color:var(--navy); box-shadow:var(--focus); }
  .q .btn { margin-top:10px; }
  .msg { font-size:14px; min-height:20px; margin:8px 0 0; } .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .rep { display:flex; gap:14px; align-items:center; }
  .rep .doc { width:44px; height:52px; border:1px solid var(--line-d); border-radius:var(--r-tag); display:grid; place-items:center; color:var(--navy); flex:none; background:var(--bg); }
  .rep b { display:block; color:var(--ink); font-weight:500; font-size:15px; } .rep span { font-size:13.5px; color:var(--muted); }
  .rep-f { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }

  /* статусы */
  .st { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; font-size:13px; font-weight:500; white-space:nowrap; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st-wait { color:var(--warn); background:var(--warn-soft); } .st-talk { color:var(--navy); background:var(--ice); } .st-ok { color:var(--ok); background:var(--ok-soft); } .st-bad { color:var(--bad); background:var(--bad-soft); }

  /* объекты */
  .obj { overflow:hidden; }
  .obj + .obj { margin-top:24px; }
  .obj-h { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; padding:28px 28px 22px; border-bottom:1px solid var(--line); }
  .obj-h h2 { font-size:26px; text-transform:uppercase; margin-top:8px; }
  .obj-h p { margin:6px 0 0; color:var(--muted); font-size:15px; }
  .obj-k { display:flex; gap:28px; }
  .obj-k div span { display:block; font-size:13px; color:var(--muted); }
  .obj-k div b { font-size:26px; font-weight:300; color:var(--ink); white-space:nowrap; }
  .obj-k div small { display:block; font-size:12.5px; color:var(--ok); }
  .obj-b { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:32px; padding:24px 28px 28px; }
  .occ { display:flex; height:30px; margin:12px 0 10px; overflow:hidden; border-radius:var(--r-tag); }
  .occ span { height:100%; border-right:2px solid #fff; background:var(--navy); }
  .occ span:nth-child(even) { background:var(--navy-d); }
  .occ .free { background:repeating-linear-gradient(135deg, var(--bg-2) 0 6px, var(--line-d) 6px 12px) !important; border:0; }
  .occ-l { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); margin-bottom:22px; }
  .occ-l i { display:inline-block; width:10px; height:10px; margin-right:6px; background:var(--navy); vertical-align:-1px; border-radius:2px; }
  .occ-l .f i { background:var(--line-d); }
  .vac { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .vac div { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:12px 14px; border:1px dashed var(--line-d); border-radius:var(--r); font-size:15px; }
  .vac b { font-weight:500; color:var(--ink); } .vac small { display:block; color:var(--muted); font-size:13px; }

  /* таблица арендаторов */
  .tbl { width:100%; border-collapse:collapse; font-size:15px; }
  .tbl th { text-align:left; font-size:13px; font-weight:400; color:var(--muted); padding:0 12px 12px 0; border-bottom:1px solid var(--line-d); white-space:nowrap; }
  .tbl td { padding:14px 12px 14px 0; border-bottom:1px solid var(--line); vertical-align:middle; }
  .tbl tr:last-child td { border-bottom:0; }
  .tbl .n { text-align:right; white-space:nowrap; }
  .tbl b { font-weight:500; color:var(--ink); }
  .tbl td small { display:block; color:var(--muted); font-size:13px; }
  .tbl-wrap { overflow-x:auto; }

  /* работы */
  .work { display:grid; grid-template-columns:1fr auto; gap:6px 24px; padding:20px 28px; border-bottom:1px solid var(--line); }
  .work:last-child { border-bottom:0; }
  .work b { color:var(--ink); font-weight:500; font-size:17px; }
  .work p { margin:0; color:var(--muted); font-size:14px; }
  .work .r { grid-row:1 / span 3; grid-column:2; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .work .cost { font-size:20px; font-weight:300; color:var(--ink); }
  .budget { margin-top:24px; max-width:640px; }

  /* отчёты */
  .row { display:grid; grid-template-columns:44px minmax(0,1fr) 150px 150px 110px; gap:16px; align-items:center; padding:14px 28px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .ico { width:40px; height:48px; border:1px solid var(--line-d); border-radius:var(--r-tag); background:var(--bg); color:var(--navy); display:grid; place-items:center; }
  .row .t { font-weight:500; color:var(--ink); } .row .d { font-size:14px; color:var(--text); }
  .row.soon { background:var(--bg); } .row.soon .t, .row.soon .ico { color:var(--muted); }
  .chip { font-size:13px; color:var(--muted); }

  /* формы */
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field > span { font-size:14px; color:var(--muted); }
  .field input, .field textarea { width:100%; border:1px solid var(--line-d); border-radius:var(--r); padding:10px 14px; background:var(--surface); resize:vertical; }
  .field input:focus, .field textarea:focus { outline:0; border-color:var(--navy); box-shadow:var(--focus); }
  .check { display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-top:1px solid var(--line); cursor:pointer; }
  .check:first-of-type { border-top:0; }
  .check input { width:18px; height:18px; margin-top:3px; accent-color:var(--navy); flex:none; }
  .check b { display:block; color:var(--ink); font-weight:500; } .check span { font-size:14px; color:var(--muted); }

  /* вход */
  .login { max-width:440px; margin:-90px auto 40px; position:relative; box-shadow:var(--shadow); }
  .login h1 { font-size:28px; text-transform:uppercase; margin:10px 0 8px; } .login p { margin:0 0 22px; color:var(--muted); }
  .hint { background:var(--bg); border-radius:var(--r); padding:12px 14px; font-size:14px; margin-bottom:16px; }

  footer { color:var(--muted); font-size:14px; border-top:1px solid var(--line); }
  footer .wrap { display:flex; justify-content:space-between; gap:12px 32px; flex-wrap:wrap; padding-top:20px; padding-bottom:24px; }
  footer small { display:block; font-size:12.5px; margin-top:4px; }
  footer a { color:var(--ink); text-decoration:none; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--graphite); color:#fff; padding:12px 20px; border-radius:999px; font-size:15px; box-shadow:var(--shadow); z-index:10; }

  @media (max-width: 1080px) {
    .cols { grid-template-columns:1fr; } .side { position:static; order:-1; }
    .band-home { grid-template-columns:1fr; gap:28px; }
    .obj-h, .obj-b { grid-template-columns:1fr; }
    .row { grid-template-columns:44px minmax(0,1fr) 100px; } .row .hide-m { display:none; }
  }
  @media (max-width: 640px) {
    .wrap { padding:0 16px; } .bar .tag, .bar .demo, .logo small, .bar .who { display:none; } .bar .btn { margin-left:auto; }
    .big { font-size:52px; } .band h1 { font-size:28px; } .kpis b { font-size:20px; } .kpis div + div { padding-left:10px; }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ');

const pct = (x) => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(0) + '%';
const pp = (x) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1).replace('.', ',') + ' п. п.';
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const MN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const date = (iso) => { const [y, m, d] = iso.slice(0, 10).split('-'); return `${+d} ${MG[+m - 1]}${y === '2026' ? '' : ' ' + y}`; };
const shortDate = (iso) => { const [, m, d] = iso.slice(0, 10).split('-'); return `${+d} ${MG[+m - 1].slice(0, 3)}`; };

const monthsTo = (ym) => { const [y, m] = data.today.split('-').map(Number), [y2, m2] = ym.split('-').map(Number); return (y2 - y) * 12 + (m2 - m); };

const I = {

  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',

async function api(path, body) {
  const r = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { logout(); throw new Error('Войдите заново'); }
  if (!r.ok) throw new Error(j.error || 'Ошибка сервера');

}

// ---------- график: сетка, подписи, текущий месяц — синим ----------
function barChart(months, key, fmt, label) {
  const w = 760, h = 260, top = 24, bottom = 30, left = 34, n = months.length, gap = (w - left) / n, bw = Math.min(34, gap * .56);
  const max = Math.max(...months.map((m) => m[key])) * 1.1;
  const y = (v) => top + (h - top - bottom) * (1 - v / max);
  const grid = [.25, .5, .75, 1].map((k) => `<line class="grid" x1="${left}" x2="${w}" y1="${y(max * k)}" y2="${y(max * k)}"/><text class="y" x="0" y="${y(max * k) + 4}">${fmt(max * k, true)}</text>`).join('');
  const cols = months.map((m, i) => {
    const x = left + gap * i + (gap - bw) / 2, yy = y(m[key]), last = i === n - 1;
    return `<g class="col" data-i="${i}"><rect x="${left + gap * i}" y="0" width="${gap}" height="${h}" fill="transparent"/>
      <rect class="b${last ? ' cur' : ''}" x="${x}" y="${yy}" width="${bw}" height="${h - bottom - yy}"/>
      ${last ? `<text class="v" x="${x + bw / 2}" y="${yy - 8}" text-anchor="middle">${fmt(m[key], true)}</text>` : ''}
      <text class="m" x="${x + bw / 2}" y="${h - 8}" text-anchor="middle">${MN[+m.month.slice(5) - 1].slice(0, 3)}</text></g>`;
  }).join('');
  return `<div class="chart" data-chart><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${grid}<line class="ax" x1="${left}" x2="${w}" y1="${h - bottom}" y2="${h - bottom}"/>${cols}</svg><div class="tip" hidden></div></div>`;
}
function wireChart(root, months, key, fmt) {
  const box = $('[data-chart]', root), tip = $('.tip', box);
  box.addEventListener('mousemove', (e) => {
    const g = e.target.closest('.col'); if (!g) { tip.hidden = true; return; }
    const m = months[+g.dataset.i], r = box.getBoundingClientRect(), b = $('.b', g).getBoundingClientRect();
    tip.innerHTML = `${monthName(m.month)}<b>${fmt(m[key])}</b>`; tip.hidden = false;
    tip.style.left = (b.left + b.width / 2 - r.left) + 'px'; tip.style.top = (b.top - r.top) + 'px';
  });
  box.addEventListener('mouseleave', () => { tip.hidden = true; });
}

const allTenants = () => data.portfolio.objects.flatMap((o) => o.tenants.map((t) => ({ ...t, obj: o.title })));

  const ending = allTenants().filter((t) => monthsTo(t.until) <= 6).sort((a, b) => a.until.localeCompare(b.until));
  if (ending.length) out.push({ lvl: 'info', title: `${ending.length} ${plural(ending.length, 'договор', 'договора', 'договоров')} до ${MG[+ending.at(-1).until.slice(5) - 1]}`, text: `${num(sumBy(ending, 'area'))} м², первый — в ${MP[+ending[0].until.slice(5) - 1]}`, st: ['st-talk', 'Продлеваем'], tab: 'tenants' });
  const vac = data.portfolio.objects.flatMap((o) => o.vacant);

}

        <div><span>Заполняемость</span><b>${o.occ}%</b><small>${pp(o.occYoY)} за год</small></div>
        <div><span>Ставка</span><b>${num(o.rate)} ₽/м²</b><small>${pct(o.rateYoY)} за год</small></div>
        <div><span>Вам за месяц</span><b>${mln(o.payout)}</b><small>${pct(o.collectedYoY)} поступления</small></div>
      </div></div>
    <div class="obj-b">
      <div><span class="lbl">Занятость площадей</span>${occBar(o)}<span class="lbl">Поступления за 12 месяцев</span><div data-objchart="${o.id}">${barChart(o.months, 'collected', METRICS.collected.fmt, 'Поступления по объекту')}</div></div>
      <div><span class="lbl">Свободные площади</span>
        ${o.vacant.length ? `<div class="vac">${o.vacant.map((v) => `<div><span><b>${esc(v.title)} · ${num(v.area)} м²</b><small>${esc(v.note)} · от ${num(v.rate)} ₽/м²</small></span><span class="st ${v.status === 'Переговоры' ? 'st-wait' : 'st-talk'}">${esc(v.status)}</span></div>`).join('')}</div>` : `<p class="ok-line" style="margin-top:12px">${icon('check')}Объект заполнен полностью</p>`}
        <p style="margin:20px 0 0"><button class="lnk" data-tab="tenants">Арендаторы и договоры ${icon('arrow')}</button></p>
      </div>
    </div>
  </section>`).join('');
  return [top, body];
}

function tenantsView() {
  const list = allTenants().sort((a, b) => (b.debt - a.debt) || a.until.localeCompare(b.until));
  const soon = list.filter((t) => monthsTo(t.until) <= 12), debt = list.reduce((s, t) => s + t.debt, 0);
  const top = band('Арендаторы', 'Договоры и платежи', 'Сначала — те, где нужно внимание: долги и договоры, которые скоро заканчиваются.',
    `<div class="band-sum"><div><span>Арендаторов</span><b>${list.length}</b></div><div><span>Договоры, заканчивающиеся за 12 месяцев</span><b>${soon.length} · ${num(soon.reduce((s, t) => s + t.area, 0))} м²</b></div><div class="${debt ? 'alert' : ''}"><span>Просроченный долг</span><b>${rub(debt)}</b></div></div>`);
  const body = `<div class="card pad tbl-wrap"><table class="tbl">
    <thead><tr><th>Арендатор</th><th>Объект</th><th class="n">Площадь</th><th>Договор до</th><th>Платежи</th></tr></thead>
    <tbody>${list.map((t) => { const left = monthsTo(t.until); return `<tr>
      <td><b>${esc(t.name)}</b><small>${Math.round(t.share * 100)}% занятой площади объекта</small></td>
      <td>${esc(t.obj)}</td><td class="n">${num(t.area)} м²</td>
      <td>${monthName(t.until)}${left <= 6 ? `<small style="color:var(--warn)">через ${left} мес.</small>` : ''}</td>
      <td>${t.debt ? `<span class="st st-bad">${rub(t.debt)} · ${t.debtDays} дн.</span>` : '<span class="st st-ok">Без долгов</span>'}</td></tr>`; }).join('')}</tbody>
  </table></div>`;
  return [top, body];
}

const WS = { 'Запланировано': 'st-talk', 'В работе': 'st-wait', 'Выполнено': 'st-ok' };
function worksView() {
  const objName = Object.fromEntries(data.portfolio.objects.map((o) => [o.id, o.title]));
  const order = ['В работе', 'Запланировано', 'Выполнено'];
  const list = data.works.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || b.date.localeCompare(a.date));
  const sum = (st) => data.works.filter((w) => w.status === st).reduce((s, w) => s + w.cost, 0);
  const used = data.works.reduce((s, w) => s + w.cost, 0), B = data.worksBudget;
  const top = band('Работы и расходы', 'Что делаем на объектах', 'Ремонт и обслуживание ведём сами в рамках годового бюджета эксплуатации — от вас решений не требуется. Сметы и закрывающие документы — в отчёте месяца.',
    `<div class="band-sum"><div><span>Выполнено в 2026 году</span><b>${rub(sum('Выполнено'))}</b></div><div><span>В работе и запланировано</span><b>${rub(sum('В работе') + sum('Запланировано'))}</b></div><div><span>Остаток бюджета года</span><b>${rub(B - used)}</b></div></div>
    <div class="plan budget"><div class="plan-t"><span>Бюджет эксплуатации 2026: <b>${rub(used)}</b> из ${rub(B)}</span><span>${Math.round(used / B * 100)}%</span></div><div class="plan-bar"><span style="width:${Math.min(100, used / B * 100).toFixed(1)}%"></span></div></div>`);
  const body = `<div class="card">${list.map((w) => `<div class="work">
    <div><b>${esc(w.title)}</b><p>${esc(objName[w.obj] || '')} · ${w.status === 'Выполнено' ? 'выполнено' : 'срок'} ${date(w.date)}</p></div>
    <div class="r"><span class="cost">${rub(w.cost)}</span><span class="st ${WS[w.status]}">${esc(w.status)}</span></div>
    <p>${esc(w.note)}</p>
  </div>`).join('')}</div>`;
  return [top, body];
}

const KIND = { month: 'Ежемесячный', quarter: 'Квартальный', week: 'Сводка за неделю' };
let repFilter = 'all';
function reportsView() {
  const show = (r) => repFilter === 'all' || (repFilter === 'week' ? r.kind === 'week' : r.kind !== 'week');
  const s = data.settings;
  const top = band('Отчёты', 'Отчёты и сводки', 'Ежемесячный — до 5 числа, квартальный — до 7 числа, сводка — по понедельникам. Всё приходит на почту и хранится здесь.');
  const body = `<div class="card-h"><div class="seg" role="group" aria-label="Фильтр">${[['all', 'Все'], ['month', 'Отчёты'], ['week', 'Сводки']].map(([k, t]) => `<button data-rep="${k}" class="${repFilter === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <span class="small muted">Получатели: ${s.emails.map(esc).join(', ')} · <button class="lnk" data-tab="settings">изменить</button></span></div>
  <div class="card" style="overflow:hidden">
    ${data.upcoming.filter(show).map((r) => `<div class="row soon"><span class="ico">${icon('clock')}</span><div><div class="t">${esc(r.title)}</div><div class="chip">${KIND[r.kind]}</div></div><span class="d hide-m">придёт ${date(r.sent)}</span><span class="hide-m"></span><span></span></div>`).join('')}
    ${data.reports.filter(show).map((r) => `<div class="row"><span class="ico">${icon('doc')}</span><div><div class="t">${esc(r.title)}</div><div class="chip">${KIND[r.kind]}</div></div><span class="d hide-m">${date(r.sent)}</span><span class="d hide-m">${r.kind === 'week' ? '1 страница' : '3 страницы'} · PDF</span><button class="btn sm" data-pdf="${r.id}" ${r.ready ? '' : 'disabled'}>Открыть</button></div>`).join('')}
  </div>`;
  return [top, body];
}

function settingsView() {
  const s = data.settings;
  const top = band('Настройки', 'Отчёты и доступ', '');
  const body = `<div class="cols">
    <section class="card pad">
      <div class="card-h"><h2>Отчёты на почту</h2></div>
      <form id="settings">
        <label class="check"><input type="checkbox" name="monthly" ${s.monthly ? 'checked' : ''}><span><b>Ежемесячный отчёт</b><span>Доход, заполняемость, арендаторы, деньги к перечислению — до 5 числа</span></span></label>
        <label class="check"><input type="checkbox" name="quarterly" ${s.quarterly ? 'checked' : ''}><span><b>Квартальный отчёт</b><span>Итоги квартала и план на следующий — до 7 числа</span></span></label>
        <label class="check"><input type="checkbox" name="weekly" ${s.weekly ? 'checked' : ''}><span><b>Сводка за неделю</b><span>Одна страница по понедельникам: поступления и новости</span></span></label>
        <label class="field" style="margin-top:12px"><span>Кому отправлять — по одному адресу в строке</span><textarea name="emails" rows="3">${s.emails.map(esc).join('\n')}</textarea></label>
        <button class="btn pri">Сохранить</button><p class="msg" id="sm"></p>
      </form>
    </section>
    <aside class="side">
      <section class="card pad"><div class="card-h"><h2>Перечисления</h2></div>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:15px"><dt class="muted">Получатель</dt><dd style="margin:0">${esc(data.owner.name)}</dd><dt class="muted">Счёт</dt><dd style="margin:0">•••• 4417</dd><dt class="muted">Когда</dt><dd style="margin:0">до 10 числа следующего месяца</dd></dl>
        <p class="small muted" style="margin:14px 0 0">Реквизиты меняются только через управляющего — для вашей безопасности.</p></section>
      <section class="card pad"><div class="card-h"><h2>Вход</h2></div><p class="small" style="margin:0">По коду на <b>${esc(data.email)}</b>. Сессия действует 30 дней на этом устройстве.</p></section>
    </aside>
  </div>`;
  return [top, body];
}

// ---------- отрисовка и события ----------
async function render() {
  if (!token) return loginView();
  if (!data) {
    $('#app').innerHTML = '<p class="muted">Загружаем…</p>';
    try { data = await api('me'); } catch (e) { if (token) $('#app').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  }
  $('#who').innerHTML = `${esc(data.owner.person)}<small>${esc(data.owner.name)}</small>`; $('#logout').hidden = false;
  const views = { home: homeView, objects: objectsView, tenants: tenantsView, works: worksView, reports: reportsView, settings: settingsView };
  const [top, body] = views[tab]();
  $('#top').innerHTML = tabsHtml() + top;
  $('#app').innerHTML = body;
  if (tab === 'home') wireChart($('#chart'), data.portfolio.months, 'payout', METRICS.payout.fmt);
  if (tab === 'objects') data.portfolio.objects.forEach((o) => wireChart($(`[data-objchart="${o.id}"]`), o.months, 'collected', METRICS.collected.fmt));
}

function openQuestion() {
  const f = $('#q'); f.hidden = false;
  f.text.focus(); f.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { location.hash = t.dataset.tab; return; }
  const m = e.target.closest('[data-metric]');
  if (m) {
    const k = m.dataset.metric, M = METRICS[k];
    m.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === m));
    $('#chart').innerHTML = barChart(data.portfolio.months, k, M.fmt, M.label + ' за 12 месяцев');
    wireChart($('#chart'), data.portfolio.months, k, M.fmt); return;
  }
  if (e.target.closest('[data-write]')) { openQuestion(); return; }
  const rf = e.target.closest('[data-rep]');
  if (rf) { repFilter = rf.dataset.rep; render(); return; }
  const pdf = e.target.closest('[data-pdf]');
  if (pdf) {
    const w = window.open('', '_blank');   // окно — сразу по клику, иначе браузер заблокирует его после загрузки
    try {
      const r = await fetch('/api/report/' + pdf.dataset.pdf + '.pdf', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Отчёт не загрузился');
      const url = URL.createObjectURL(await r.blob());
      if (w) w.location = url; else location.href = url;
    } catch (err) { if (w) w.close(); toast(err.message); }
    return;
  }
});
document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'q') {
    e.preventDefault();
    try { await api('question', { text: f.text.value }); f.reset(); $('#qm').className = 'msg ok'; $('#qm').textContent = 'Отправлено — управляющий ответит в течение рабочего дня'; }
    catch (err) { $('#qm').className = 'msg err'; $('#qm').textContent = err.message; }
  }
  if (f.id === 'settings') {
    e.preventDefault();
    try { const r = await api('settings', { settings: { monthly: f.monthly.checked, quarterly: f.quarterly.checked, weekly: f.weekly.checked, emails: f.emails.value.split(/[\s,;]+/) } }); data.settings = r.settings; $('#sm').className = 'msg ok'; $('#sm').textContent = 'Сохранено'; }
    catch (err) { $('#sm').className = 'msg err'; $('#sm').textContent = err.message; }
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) { tab = h; render(); window.scrollTo(0, 0); } });
render();
</script>
</body>
</html>
