<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="referrer" content="origin">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>html,body,#map{height:100%;margin:0}body{font:14px Arial;color:#1f2433;background:#e9edf5}.leaflet-container{font:13px Arial}.pin{display:block;width:26px;height:26px;background:#1c2d58;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 8px #1c2d5855}.pin:after{content:"";display:block;width:8px;height:8px;background:#fff;border-radius:50%;margin:9px}.selected .pin{background:#2f4a8a;outline:5px solid #a6c2e8}.leaflet-marker-icon:focus{outline:3px solid #2f4a8a}#status{position:absolute;z-index:1000;bottom:28px;left:12px;right:12px;padding:10px;background:#fff;border-radius:6px;box-shadow:0 2px 8px #0002}.leaflet-tile-pane{filter:saturate(.62)}.leaflet-control-zoom{border:0!important;border-radius:12px!important;overflow:hidden;box-shadow:0 3px 14px #1c2d5826!important}.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;color:#1c2d58!important}.leaflet-tooltip{border:0;border-radius:8px;padding:7px 10px;box-shadow:0 3px 12px #1c2d5820}.leaflet-control-attribution{font-size:10px!important}.route-end{background:#1c2d58;color:#fff;border:3px solid white;border-radius:50%;font:bold 14px/28px Arial;text-align:center;box-shadow:0 2px 8px #0004}</style></head><body>
<div id="map" aria-label="Карта объектов"></div><div id="status" role="status">Загрузка карты…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
function opMapFrame(data, channel) {
  const status = document.getElementById('status');
  if (!window.L) { status.textContent = 'Карта недоступна. Выберите объект в списке слева.'; return; }
  const map = L.map('map', { scrollWheelZoom: false, zoomControl:false }).setView([55.9, 37.7], 9);
  L.control.zoom({position:'bottomright',zoomInTitle:'Приблизить',zoomOutTitle:'Отдалить'}).addTo(map);
  map.attributionControl.addAttribution('<a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener">OSRM / FOSSGIS</a> · <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Исправить карту</a>');
  function padding() { const w = map.getSize().x; return {paddingTopLeft:w > 1100 ? [312,116] : w > 800 ? [274,116] : [32,116], paddingBottomRight:w > 1100 ? [328,56] : w > 800 ? [290,56] : [32,48]}; }
  let loaded = false;
  let tileId = 0;
  const pendingTiles = new Map();
  const tiles = L.tileLayer('', {maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'});
  tiles.createTile = function(coords,done) {
    const image = document.createElement('img'), requestId = ++tileId;
    image.alt = ''; pendingTiles.set(requestId,{image:image,done:done});
    parent.postMessage({type:'crm-object-map-tile-request',channel:channel,requestId:requestId,z:coords.z,x:coords.x,y:coords.y},'*');
    return image;
  };
  window.addEventListener('message',function(e) {
    const d = e.data;
    if (e.source !== parent || !d || d.channel !== channel || d.type !== 'crm-object-map-tile') return;
    const tile = pendingTiles.get(d.requestId); if (!tile) return;
    pendingTiles.delete(d.requestId);
    if (d.error || !(d.buffer instanceof ArrayBuffer)) { tile.done(new Error('Tile unavailable'),tile.image); return; }
    const url = URL.createObjectURL(new Blob([d.buffer],{type:'image/png'}));
    tile.image.onload = function() { URL.revokeObjectURL(url); tile.done(null,tile.image); };
    tile.image.onerror = function() { URL.revokeObjectURL(url); tile.done(new Error('Tile unavailable'),tile.image); };
    tile.image.src = url;
  });
  tiles.on('tileload', function() { loaded = true; status.hidden = true; })
    .on('tileerror', function() { if (!loaded) { status.hidden = false; status.textContent = 'Подложка карты недоступна. Метки и список объектов работают.'; } }).addTo(map);
  const markers = {};
  data.forEach(function(o) {
    const marker = L.marker([o.lat, o.lon], { title: o.name, keyboard: true, icon: L.divIcon({
      className: '', html: '<span class="pin"></span>', iconSize: [34, 38], iconAnchor: [17, 38]
    }) }).addTo(map);
    const label = document.createElement('span'); label.textContent = o.name;
    marker.bindTooltip(label, { direction: 'top', offset: [0, -30] });
    marker.on('click', function() { parent.postMessage({ type: 'crm-object-map-select', channel: channel, id: o.id }, '*'); });
    markers[o.id] = marker;
  });
  function update(message) {
    const bounds = [];
    data.forEach(function(o) {
      const m = markers[o.id], visible = message.ids.indexOf(o.id) !== -1;
      if (visible) { if (!map.hasLayer(m)) m.addTo(map); bounds.push([o.lat, o.lon]); } else map.removeLayer(m);
      const el = m.getElement(); if (el) el.classList.toggle('selected', o.id === message.id);
      m.setZIndexOffset(o.id === message.id ? 1000 : 0);
    });
    if (message.fit && bounds.length) map.fitBounds(bounds, Object.assign(padding(), {maxZoom:12}));
    else if (message.focus && markers[message.id] && message.ids.indexOf(message.id) !== -1) {
      map.setView(markers[message.id].getLatLng(), Math.max(map.getZoom(), 13));
      markers[message.id].openTooltip();
    }
  }
  let routeLayer = null;
  function drawRoute(message) {
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = null;
    const r = message.route; if (!r) return;
    routeLayer = L.featureGroup().addTo(map);
    L.geoJSON(r.geometry, {style:{color:'#fff',weight:9,opacity:0.95}}).addTo(routeLayer);
    L.geoJSON(r.geometry, {style:{color:'#2f4a8a',weight:5,opacity:1}}).addTo(routeLayer);
    [r.from,r.to].forEach(function(id,i) {
      const o = data.find(function(x) { return x.id === id; }); if (!o) return;
      const coords = r.geometry.coordinates, point = coords[i ? coords.length - 1 : 0], road = L.latLng(point[1],point[0]);
      if (road.distanceTo([o.lat,o.lon]) > 20) L.polyline([[o.lat,o.lon],road], {color:'#2f4a8a',weight:3,dashArray:'5 7'}).addTo(routeLayer);
      const label = document.createElement('span'); label.textContent = (i ? 'Б · ' : 'А · ') + o.name;
      L.marker([o.lat,o.lon], {title:label.textContent,zIndexOffset:2000,icon:L.divIcon({className:'route-end',html:i ? 'Б' : 'А',iconSize:[28,28],iconAnchor:[14,14]})})
        .bindTooltip(label).addTo(routeLayer);
    });
    if (message.fit) map.fitBounds(routeLayer.getBounds(), Object.assign(padding(), {maxZoom:15}));
  }
  window.addEventListener('message', function(e) {
    if (e.source !== parent || !e.data || e.data.channel !== channel) return;
    if (e.data.type === 'crm-object-map-state') update(e.data);
    if (e.data.type === 'crm-object-map-route') drawRoute(e.data);
  });
  map.on('click focus', function() { map.scrollWheelZoom.enable(); });
  parent.postMessage({ type: 'crm-object-map-ready', channel: channel }, '*');
}

let initialized = false;
window.addEventListener('message', function(e) {
  const d = e.data;
  if (initialized || e.source !== parent || !d || d.type !== 'crm-object-map-init'
    || typeof d.channel !== 'string' || d.channel.length < 8 || d.channel.length > 200
    || !Array.isArray(d.objects) || d.objects.length > 1000) return;
  if (!d.objects.every(function(o) { return o && Number.isSafeInteger(o.id) && o.id > 0
    && typeof o.name === 'string' && o.name.length <= 500 && typeof o.lat === 'number' && typeof o.lon === 'number'
    && Number.isFinite(o.lat) && Number.isFinite(o.lon) && Math.abs(o.lat) <= 90 && Math.abs(o.lon) <= 180; })) return;
  initialized = true;
  opMapFrame(d.objects, d.channel);
});
</script></body></html>
